worker_processes 1;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Optimización DICOM
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500M; 

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        # === ESTRATEGIA ROOT ===
        # Al definir esto, "/viewer" buscará en "/usr/share/nginx/html/viewer" automáticamente.
        root /usr/share/nginx/html;
        index index.html;
        
        # 1. OHIF VIEWER
        location /viewer/ {
            # Magia SPA: Si no existe el archivo, carga el index.html de la carpeta viewer
            try_files $uri $uri/ /viewer/index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        
        # Asegurar que el config se sirva como JS (evita el bucle ???)
        location = /viewer/app-config.js {
            try_files $uri =404;
            add_header Content-Type application/javascript;
        }

        # 2. PROXIES
        location / {
            proxy_pass http://heros-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        location /api/ {
            proxy_pass http://heros-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /dcm4chee-arc/ {
            proxy_pass https://10.73.173.205:8443/dcm4chee-arc/;
            proxy_ssl_verify off;
            proxy_set_header Host $http_host; 
        }
        
        location /realms/ {
            proxy_pass https://10.73.173.205:8843/realms/;
            proxy_ssl_verify off;
            proxy_set_header X-Forwarded-Proto https;
        }
        
        location /auth/ {
            proxy_pass https://10.73.173.205:8843/;
            proxy_ssl_verify off;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 6. ESTADÍSTICAS (Ahora sí en /stats/)
        # -----------------------------------------------------------
        location /stats/ {
            # Docker envía lo que llega a /stats/ hacia la raíz del puerto 3001
            proxy_pass http://host.docker.internal:3001/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Desactivar compresión para poder editar el HTML
            proxy_set_header Accept-Encoding "";

            # Corrección de rutas (El truco para evitar la pantalla blanca)
            # Cambiamos las referencias de la raíz "/" a "/stats/"
            sub_filter_types text/html;
            sub_filter 'src="/' 'src="/stats/';
            sub_filter 'href="/' 'href="/stats/';
            sub_filter 'action="/' 'action="/stats/';
            sub_filter_once off;
        }

        # --- NUEVO BLOQUE PARA LA API DE ESTADISTICAS (PUERTO 8001) ---
        location /stats-api/ {
            # Aquí está el truco: Redirige al puerto 8001
            proxy_pass http://host.docker.internal:8001/api/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /dashboard/ {
            # Enviamos esto también al Backend (Puerto 8001)
            proxy_pass http://host.docker.internal:8001/dashboard/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}